; ESP32 CCR rebreather dive computer.
; See AGENTS.md section 15 for toolchain notes. Do not switch `platform` to the
; stock `espressif32` — it is pinned to Arduino core 2.x.

[platformio]
name = ccr-dive-computer
default_envs = esp32
src_dir = src
lib_dir = lib
test_dir = test

[env]
build_flags = -std=gnu++17
build_unflags = -std=gnu++11 -std=gnu++14

[env:esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = partitions.csv

; Adafruit BusIO includes SPI.h unconditionally, so the framework's SPI library has to be in
; the build even though every sensor here is I2C. PlatformIO does not scan the Arduino core's
; own libraries by default; this makes `SPI` in lib_deps resolve to it.
lib_extra_dirs = ${platformio.packages_dir}/framework-arduinoespressif32/libraries
; chain+ also scans dependency *headers* for includes, which is how Adafruit BusIO's
; unconditional `#include <SPI.h>` gets matched to the framework SPI library above.
lib_ldf_mode = deep

build_flags =
    ${env.build_flags}
    -DCFG_SCHEMA_VERSION=1
    -DCCR_ESP32=1
    -Wno-unused-but-set-variable
    ; Link map, kept on purpose: when the DRAM region overflowed after the radio went in, the
    ; only honest way to find the 57 KB was the map file, not arithmetic on the source.
    -Wl,-Map=.pio/build/esp32/firmware.map

; Version notes (verified against the registry on 2026-11-19): Adafruit's ADS1X15 driver is
; on 2.x, not 1.x — a ^1.4.0 constraint fails resolution outright. thingpulse's SSD1306
; driver tops out at 4.6.2, so ^4.6.5 also fails. Both corrected here.
lib_deps =
    esp32async/AsyncTCP@^3.4.0
    esp32async/ESPAsyncWebServer@^3.12.1
    adafruit/Adafruit ADS1X15@^2.6.2
    adafruit/Adafruit BMP085 Library@^1.1.3
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.2
    bblanchon/ArduinoJson@^7.2.0
    ; Adafruit BusIO includes SPI.h unconditionally, so the framework's SPI library must be in
    ; the build even though every sensor here is I2C. In Arduino core 3.x the core libraries
    ; depend on each other (WiFi -> Network, ESPAsyncWebServer -> WiFi), and the dependency
    ; scanner does not always chain them, so all the ones we touch are listed explicitly.
    SPI
    Wire
    WiFi
    Network
    FS
    LittleFS
    DNSServer
    ESPmDNS

; Pure-host build of lib/core + lib/sim for `pio test -e native`.
; src/ is deliberately not built here: it is ESP32-only by design (AGENTS.md 17).
[env:native]
platform = native
test_build_src = no
build_flags =
    ${env.build_flags}
    -DCFG_SCHEMA_VERSION=1
    -Wall
    -Wextra
    -Wno-unused-parameter
